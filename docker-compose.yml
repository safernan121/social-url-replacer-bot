services:
  bot:
    build: .
    image: social-url-replacer-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.db
      RULES_PATH: /app/config/rules.json
    volumes:
      - bot-data:/app/data
      - ./config/rules.json:/app/config/rules.json:ro
    # Hardening: the bot only needs outbound HTTPS to Discord.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
